version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_USER: finflow_user
      POSTGRES_PASSWORD: finflow_pass
      POSTGRES_DB: finflow_db
    ports:
      - "5433:5432" # Changed the left side to 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: