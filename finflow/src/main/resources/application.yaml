spring:
  application:
    name: finflow
    security:
      jwt:
        secretkey: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
        expiration: 900000 #15 minutes in milliseconds
        refresh-token:
          expiration: 604800000 #7 days in milliseconds

  datasource:
    url: jdbc:postgresql://localhost:5433/finflow_db
    username: finflow_user
    password: finflow_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # NEVER use 'update' in production. We use 'validate' because Flyway will handle our schemas.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8081

